# Grype ignore configuration for simpleVMWebGateway (openresty/openresty:1.31-alpine-slim).
#
# Schema: grype 0.121 expects ignore rules as a top-level `ignore:` list where
# each rule matches on `vulnerability:` (the CVE id) and optionally on
# `package.name` / `package.type`. A match is suppressed only when ALL criteria
# in a rule are met.
#
# The base image is PINNED by digest (openresty/openresty:1.31-alpine-slim@
# sha256:229f...), which is Alpine 3.24.3, openssl 3.5.9-r1
# (libcrypto3/libssl3 3.5.9-r0/r1) and python3 3.14.10-r2.
# Re-verify versions and justifications when the digest is bumped.
#
# --- OpenSSL (2026-09-29 advisory batch) ---
#
# Suppressed on REACHABILITY grounds: the deployment does NOT use
#   - DTLS  (no WebRTC / UDP TLS)        → CVE-2026-84782, CVE-2026-75806
#   - QUIC / HTTP3 (no QUIC listener)    → CVE-2026-54873, 84784, 75804,
#                                           42772, 35191, 72897
#   - SM2 or Brainpool curves            → CVE-2026-54875, 54872, 77696
#   - SSL_set_SSL_CTX() in any app       → CVE-2026-72897
#   - CMP client revocation              → CVE-2026-75805
#   - Client-certificate solicitation    → CVE-2026-35189
#
# These code paths are never exercised by OpenResty/nginx (TLS over TCP) or
# the Python service, regardless of the installed openssl branch.
#
# --- busybox (Alpine 3.24) ---
#
# CVE-2025-60876: BusyBox wget accepts raw CR/LF in the HTTP request-target,
# enabling header injection. In this image the blocklist download script
# (generate_ip_blocklists.sh) uses `curl`, not BusyBox wget. No application
# in the runtime stage invokes BusyBox wget with an attacker-controlled URL.
# Already accepted as residual risk (Tier 4) in accepted-risks.md.
#
# --- python3 3.14.10-r2 (Alpine 3.24) ---
#
# CVE-2026-119170: CPython FIPS-algorithm enforcement regression. Affects
# Python 3.14.10 and ONLY when OpenSSL runs in FIPS mode. This image ships
# Python 3.14.10-r2 but with NO FIPS OpenSSL provider, so the affected code
# path is unreachable. Already accepted as residual risk (Tier 4).
#
# Remove each entry once a corresponding entry in accepted-risks.md is
# superseded by a remediated base image (if applicable).

ignore:
  # --- OpenSSL 2026-09-29 batch: not reachable in this deployment ---
  # Tier 4 — the affected code path (DTLS / QUIC / SM2 / Brainpool /
  # SSL_set_SSL_CTX / CMP / client-cert solicitation) is never exercised by
  # OpenResty/nginx (TLS over TCP) or the Python service, regardless of the
  # installed openssl branch. See accepted-risks.md.
  - vulnerability: CVE-2026-84782
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: DTLS retransmission bug; no DTLS in deployment (TLS
      over TCP only). Next review date: 2027-02-14

  - vulnerability: CVE-2026-75806
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: DTLS-only vulnerability; no DTLS in deployment (TLS
      over TCP only). Next review date: 2027-02-14

  - vulnerability: CVE-2026-54873
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: QUIC STREAM fragment metadata DoS; no QUIC/HTTP3 in
      deployment (TLS over TCP / HTTP2 only). Next review date: 2027-02-14

  - vulnerability: CVE-2026-84784
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: QUIC RETIRE_CONNECTION_ID DoS; no QUIC/HTTP3 in
      deployment (TLS over TCP / HTTP2 only). Next review date: 2027-02-14

  - vulnerability: CVE-2026-72897
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: SSL_set_SSL_CTX() OOB during handshake; no app calls
      SSL_set_SSL_CTX(). Next review date: 2027-02-14

  - vulnerability: CVE-2026-75804
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: QUIC-only vulnerability; no QUIC/HTTP3 in deployment
      (TLS over TCP / HTTP2 only). Next review date: 2027-02-14

  - vulnerability: CVE-2026-42772
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: QUIC O(n^2) fragment reassembly CPU DoS; no QUIC/HTTP3
      in deployment (TLS over TCP / HTTP2 only). Next review date: 2027-02-14

  - vulnerability: CVE-2026-35191
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: QUIC amplification-credit over-accounting; no
      QUIC/HTTP3 in deployment (TLS over TCP / HTTP2 only).
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-75805
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: CMP client revocation; no CMP client in deployment.
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-35189
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: CRL distribution point memory growth during
      client-certificate verification; no client-certificate solicitation
      (ssl_verify_client) is configured in this deployment.
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-54875
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: SM2 scalar-multiplication side-channel; no SM2 curves
      in use and deployment runs x86_64 (not ARM64/RISC-V).
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-54872
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: generic-prime EC (Brainpool) scalar-multiplication
      side-channel; only NIST P-256/P-384 curves are in use, which have
      dedicated constant-time implementations. Next review date: 2027-02-14

  - vulnerability: CVE-2026-77696
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: SM2 signature-generation side-channel; no SM2 signature
      generation in deployment (standard ECDSA P-256/P-384 in use).
      Next review date: 2027-02-14

  # --- OpenSSL Nov-2026 advisory batches (secadv 20261110/17/24) ---
  # This image ships openssl 3.5.9-r1 (Alpine 3.24).
  #
  # CVE-2026-124709, CVE-2026-107494 and CVE-2026-121482: Tier 4 — the
  # vulnerable code does not exist in this branch, or the affected API is
  # never called. The QUIC stack (124709, 107494) lives in the 3.5/4.0/4.1
  # code but no QUIC/HTTP3 listener is configured in this deployment;
  # 121482 requires CMS/PKCS#7 verification with CRL checking, which this
  # app never does. See accepted-risks.md.

  - vulnerability: CVE-2026-124709
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: QUIC-only vulnerability (memory retention in rejected
      QUIC streams); no QUIC/HTTP3 listener is configured in this
      deployment (TLS over TCP / HTTP2 only).
      Next review date: 2027-02-25

  - vulnerability: CVE-2026-107494
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: QUIC-only vulnerability (unbounded
      RETIRE_CONNECTION_ID frame queue); no QUIC/HTTP3 listener is
      configured in this deployment (TLS over TCP / HTTP2 only).
      Next review date: 2027-02-25

  - vulnerability: CVE-2026-121482
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: requires CMS/PKCS#7 SignedData verification with
      CRL checking enabled (X509_V_FLAG_CRL_CHECK); this app performs no
      CMS/PKCS#7 verification at all.
      Next review date: 2027-02-25

  # CVE-2026-84786 (NULL deref in non-SMTP DANE clients) affects the
  # 3.5/4.0/4.1 branches — this image's openssl 3.5.9-r1 is in the range.
  # Suppressed on reachability grounds: no DANE/TLSA-enabled TLS clients
  # exist in this deployment.
  - vulnerability: CVE-2026-84786
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: no DANE/TLSA-enabled TLS clients in this deployment;
      the DANE API is never used.
      Next review date: 2027-02-25

  # CVE-2026-95690 (DTLS reassembly memory exhaustion) and CVE-2026-35190
  # (TLS 1.3 key-share OOB read with Suite B flag) affect the 3.5/4.0/4.1
  # branches (95690 also 3.0/1.1.1). This image ships openssl 3.5.9-r1
  # (Alpine 3.24) — the 3.5 branch IS in the affected range, so these
  # cannot be claimed as version false positives. They are suppressed on
  # reachability grounds instead: no DTLS anywhere in this deployment
  # (TLS over TCP only), and the Suite B certificate flag is not
  # configured. No app calls the affected APIs.
  - vulnerability: CVE-2026-95690
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: no DTLS in deployment (TLS over TCP only); the DTLS
      handshake reassembly code path is never exercised.
      Next review date: 2027-02-25

  - vulnerability: CVE-2026-35190
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: the CVE only triggers when the Suite B certificate
      flag (SSL_CERT_FLAG_SUITEB_128_LOS) is set via
      SSL_CTX_set_cert_flags(); no such flag is configured in this
      deployment.
      Next review date: 2027-02-25

  # CVE-2026-95692 (AES-GCM-SIV IV length handling) and CVE-2026-88823
  # (AES-GCM-SIV zero-length AAD reset) only affect applications that call
  # the AES-GCM-SIV cipher via EVP_CipherInit_ex(). TLS in this deployment
  # uses standard AES-GCM, not SIV, and no Python or Lua code calls any
  # AES-GCM-SIV EVP cipher. OpenSSL's advisory: "The OpenSSL TLS and QUIC
  # implementations do not use this path."
  - vulnerability: CVE-2026-95692
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: no code in this deployment uses AES-GCM-SIV; TLS uses
      standard AES-GCM (not SIV). No Python or Lua code calls
      EVP_CipherInit_ex() with an AES-GCM-SIV cipher.
      Next review date: 2027-02-25

  - vulnerability: CVE-2026-88823
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: no code in this deployment uses AES-GCM-SIV with
      chunked (zero-length incremental) AAD; TLS uses standard AES-GCM
      (not SIV). No Python or Lua code calls the AES-GCM-SIV EVP cipher.
      Next review date: 2027-02-25

  # CVE-2026-107496 (infinite loop in CMS_encrypt() with EC group order 1)
  # only affects applications that call CMS_encrypt() / CMS_encrypt_ex()
  # with an attacker-controlled EC recipient certificate. No code in this
  # deployment performs CMS/S-MIME encryption. OpenSSL's advisory: "The
  # OpenSSL TLS and QUIC implementations do not use this path."
  - vulnerability: CVE-2026-107496
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: no code in this deployment calls CMS_encrypt() or
      CMS_encrypt_ex(); no S-MIME / CMS encryption exists in this stack.
      Next review date: 2027-02-25

  # --- busybox (Alpine 3.24): wget header injection ---
  # Already accepted (Tier 4) in accepted-risks.md. Covers busybox,
  # busybox-binsh and ssl_client (same CVE id, same apk source).
  - vulnerability: CVE-2025-60876
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not exploitable: blocklist downloads use curl, not BusyBox wget; no
      untrusted-URL wget path in the runtime stage. No patch yet in
      Alpine 3.24. Next review date: 2027-02-14

  # --- python3 3.14.10-r2 (Alpine 3.24) ---
  # Already accepted (Tier 4) in accepted-risks.md.
  - vulnerability: CVE-2026-119170
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: FIPS-algorithm enforcement regression in hashlib;
      only exploitable when OpenSSL runs in FIPS mode. This image ships
      Python 3.14.10-r2 (the affected version) but with NO FIPS OpenSSL
      provider, so the code path is unreachable.
      Next review date: 2027-02-14

  # CVE-2026-124249: http.cookiejar deletes cookies of other domains before
  # policy validation. Only reachable via http.cookiejar.CookieJar with
  # HTTPCookieProcessor. This app uses no cookie-jar-based HTTP client at
  # all (no outbound HTTP in the Python code).
  - vulnerability: CVE-2026-124249
    package:
      name: python3
      type: apk
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: this repo uses no cookie-jar-based HTTP client;
      no code imports http.cookiejar or urllib.request.
      Next review date: 2027-02-25

  # CVE-2026-115559: imaplib STARTTLS serves pre-handshake buffered bytes.
  # This repo does not use imaplib at all.
  - vulnerability: CVE-2026-115559
    package:
      name: python3
      type: apk
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: this repo does not use imaplib (no IMAP). No code
      imports imaplib.
      Next review date: 2027-02-25

  # CVE-2026-19552: ssl.get_server_certificate(ca_certs=...) does not check
  # hostname identity. Negligible severity (CVSS 0.0). No code in this repo
  # calls ssl.get_server_certificate().
  - vulnerability: CVE-2026-19552
    package:
      name: python3
      type: apk
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: no code in this repo calls
      ssl.get_server_certificate(); no ssl-module usage at all in this
      codebase. Negligible severity (CVSS 0.0).
      Next review date: 2027-02-25
