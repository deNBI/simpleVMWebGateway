# Grype ignore configuration for simpleVMWebGateway (openresty/openresty:1.31-alpine-slim).
#
# Schema: grype 0.121 expects ignore rules as a top-level `ignore:` list where
# each rule matches on `vulnerability:` (the CVE id) and optionally on
# `package.name` / `package.type`. A match is suppressed only when ALL criteria
# in a rule are met.
#
# --- OpenSSL 3.3.7-r2 (Alpine 3.21) ---
#
# All 13 OpenSSL CVEs from the 2026-09-29 advisory batch (and the earlier
# CVE-2026-72897) affect ONLY the following branches:
#   1.0.2, 1.1.1, 3.0  (older than 3.3)
#   3.4, 3.5, 3.6, 4.0 (newer than 3.3; QUIC / DTLS-3.3 code lives there)
#
# OpenSSL 3.3.x is NOT in any of the affected version ranges. The QUIC stack
# (introduced in 3.4), the DTLS retransmission bug, the SSL_set_SSL_CTX() OOB,
# and the SM2 / EC timing side-channels all live in code that either does not
# exist or is not present in the 3.3 branch. The OpenSSL Security Advisory
# (2026-09-29) and NVD CPE ranges confirm 3.3 is unaffected.
#
# Additionally, this deployment does NOT use:
#   - DTLS  (no WebRTC / UDP TLS)        → CVE-2026-84782, CVE-2026-75806
#   - QUIC / HTTP3 (no QUIC listener)    → CVE-2026-54873, 84784, 75804,
#                                           42772, 35191
#   - SM2 or Brainpool curves            → CVE-2026-54875, 54872, 77696
#   - SSL_set_SSL_CTX() in any app       → CVE-2026-72897
#   - CMP client revocation              → CVE-2026-75805
#   - Client-certificate solicitation    → CVE-2026-35189
#
# These are false positives: the installed openssl 3.3.7-r2 is not in any
# affected version range. No base-image upgrade will change this.
#
# --- busybox 1.37.0-r3x (Alpine 3.21) ---
#
# CVE-2025-60876: BusyBox wget accepts raw CR/LF in the HTTP request-target,
# enabling header injection. In this image the blocklist download script
# (generate_ip_blocklists.sh) uses `curl`, not BusyBox wget. No application
# in the runtime stage invokes BusyBox wget with an attacker-controlled URL.
# Already accepted as residual risk (Tier 4) in accepted-risks.md.
#
# --- python3 3.12.x (Alpine 3.21) ---
#
# CVE-2026-119170: CPython FIPS-algorithm enforcement regression. Affects
# ONLY Python 3.14.10, and only when OpenSSL runs in FIPS mode. This image
# ships Python 3.12 (Alpine 3.21) and no FIPS OpenSSL provider. Not
# exploitable in this stack. Already accepted as residual risk (Tier 3).
#
# Remove each entry once a corresponding entry in accepted-risks.md is
# superseded by a remediated base image (if applicable).

ignore:
  # --- OpenSSL 3.3.7-r2: false positive (branch not affected) ---
  # Tier 4 — not in any affected OpenSSL version range (3.3 < 3.4 QUIC
  # introduction; 1.0.2/1.1.1/3.0 are older branches). No base-image
  # upgrade changes this. See accepted-risks.md.
  - vulnerability: CVE-2026-84782
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: openssl 3.3.7-r2 is not in the affected version range
      (affects 1.0.2, 1.1.1, 3.0, 3.4, 3.5, 3.6, 4.0). No DTLS in deployment.
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-75806
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: openssl 3.3.7-r2 is not in the affected version range.
      No DTLS in deployment. Next review date: 2027-02-14

  - vulnerability: CVE-2026-54873
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: openssl 3.3.7-r2 is not in the affected version range
      (QUIC code introduced in 3.4). No QUIC/HTTP3 in deployment.
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-84784
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: openssl 3.3.7-r2 is not in the affected version range
      (QUIC code introduced in 3.4). No QUIC/HTTP3 in deployment.
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-72897
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: openssl 3.3.7-r2 is not in the affected version range
      (QUIC-era code). No app calls SSL_set_SSL_CTX().
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-75804
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: openssl 3.3.7-r2 is not in the affected version range
      (QUIC code introduced in 3.4). No QUIC/HTTP3 in deployment.
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-42772
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: openssl 3.3.7-r2 is not in the affected version range
      (QUIC code introduced in 3.4). No QUIC/HTTP3 in deployment.
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-35191
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: openssl 3.3.7-r2 is not in the affected version range
      (QUIC code introduced in 3.5). No QUIC/HTTP3 in deployment.
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-75805
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: openssl 3.3.7-r2 is not in the affected version range
      (3.4+). No CMP client revocation in deployment.
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-35189
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: openssl 3.3.7-r2 is not in the affected version range
      (3.4+). No client-certificate solicitation in deployment.
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-54875
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: openssl 3.3.7-r2 is not in the affected version range
      (3.4+). No SM2 curves in use; x86_64 not ARM64/RISC-V.
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-54872
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: openssl 3.3.7-r2 is not in the affected version range
      (3.4+). No Brainpool/generic-prime EC curves in use.
      Next review date: 2027-02-14

  - vulnerability: CVE-2026-77696
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: openssl 3.3.7-r2 is not in the affected version range
      (3.4+). No SM2 signature generation in deployment.
      Next review date: 2027-02-14

  # --- OpenSSL Nov-2026 advisory batches (secadv 20261110/17/24) ---
  # This image ships openssl 3.5.8-r0 (Alpine 3.24).
  #
  # CVE-2026-124709, CVE-2026-107494 and CVE-2026-121482: Tier 4 — the
  # vulnerable code does not exist in this branch, or the affected API is
  # never called. The QUIC stack (124709, 107494) lives in the 3.5/4.0/4.1
  # code but no QUIC/HTTP3 listener is configured in this deployment;
  # 121482 requires CMS/PKCS#7 verification with CRL checking, which this
  # app never does. See accepted-risks.md.

  - vulnerability: CVE-2026-124709
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: QUIC-only vulnerability (memory retention in rejected
      QUIC streams); no QUIC/HTTP3 listener is configured in this
      deployment (TLS over TCP / HTTP2 only).
      Next review date: 2027-02-25

  - vulnerability: CVE-2026-107494
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: QUIC-only vulnerability (unbounded
      RETIRE_CONNECTION_ID frame queue); no QUIC/HTTP3 listener is
      configured in this deployment (TLS over TCP / HTTP2 only).
      Next review date: 2027-02-25

  - vulnerability: CVE-2026-121482
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: requires CMS/PKCS#7 SignedData verification with
      CRL checking enabled (X509_V_FLAG_CRL_CHECK); this app performs no
      CMS/PKCS#7 verification at all.
      Next review date: 2027-02-25

  # CVE-2026-84786 (NULL deref in non-SMTP DANE clients) affects the
  # 3.5/4.0/4.1 branches — this image's openssl 3.5.8-r0 is in the range.
  # Suppressed on reachability grounds: no DANE/TLSA-enabled TLS clients
  # exist in this deployment.
  - vulnerability: CVE-2026-84786
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: no DANE/TLSA-enabled TLS clients in this deployment;
      the DANE API is never used.
      Next review date: 2027-02-25

  # CVE-2026-95690 (DTLS reassembly memory exhaustion) and CVE-2026-35190
  # (TLS 1.3 key-share OOB read with Suite B flag) affect the 3.5/4.0/4.1
  # branches (95690 also 3.0/1.1.1). This image ships openssl 3.5.8-r0
  # (Alpine 3.24) — the 3.5 branch IS in the affected range, so these
  # cannot be claimed as version false positives. They are suppressed on
  # reachability grounds instead: no DTLS anywhere in this deployment
  # (TLS over TCP only), and the Suite B certificate flag is not
  # configured. No app calls the affected APIs.
  - vulnerability: CVE-2026-95690
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: no DTLS in deployment (TLS over TCP only); the DTLS
      handshake reassembly code path is never exercised.
      Next review date: 2027-02-25

  - vulnerability: CVE-2026-35190
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: the CVE only triggers when the Suite B certificate
      flag (SSL_CERT_FLAG_SUITEB_128_LOS) is set via
      SSL_CTX_set_cert_flags(); no such flag is configured in this
      deployment.
      Next review date: 2027-02-25

  # --- busybox 1.37.0-r3x: wget header injection ---
  # Already accepted (Tier 4) in accepted-risks.md. Covers busybox,
  # busybox-binsh and ssl_client (same CVE id, same apk source).
  - vulnerability: CVE-2025-60876
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      No patch available in Alpine 3.21. Not exploitable: blocklist
      downloads use curl, not BusyBox wget; no untrusted-URL wget path.
      Next review date: 2027-02-14

  # --- python3 3.12.x (Alpine 3.21) ---
  # Already accepted (Tier 3) in accepted-risks.md.
  - vulnerability: CVE-2026-119170
    reason: >
      Tier 3 - risk accepted, ref guidelines/security/accepted-risks.md.
      False positive: affects only CPython 3.14.10 in FIPS mode; this image
      ships Python 3.12 (Alpine 3.21) with no FIPS OpenSSL provider.
      Next review date: 2027-02-14

  # CVE-2026-124249: http.cookiejar deletes cookies of other domains before
  # policy validation. Only reachable via http.cookiejar.CookieJar with
  # HTTPCookieProcessor. This app uses no cookie-jar-based HTTP client at
  # all (no outbound HTTP in the Python code).
  - vulnerability: CVE-2026-124249
    package:
      name: python3
      type: apk
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: this repo uses no cookie-jar-based HTTP client;
      no code imports http.cookiejar or urllib.request.
      Next review date: 2027-02-25

  # CVE-2026-115559: imaplib STARTTLS serves pre-handshake buffered bytes.
  # This repo does not use imaplib at all.
  - vulnerability: CVE-2026-115559
    package:
      name: python3
      type: apk
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: this repo does not use imaplib (no IMAP). No code
      imports imaplib.
      Next review date: 2027-02-25

  # CVE-2026-19552: ssl.get_server_certificate(ca_certs=...) does not check
  # hostname identity. Negligible severity (CVSS 0.0). No code in this repo
  # calls ssl.get_server_certificate().
  - vulnerability: CVE-2026-19552
    package:
      name: python3
      type: apk
    reason: >
      Tier 4 - risk accepted, ref guidelines/security/accepted-risks.md.
      Not reachable: no code in this repo calls
      ssl.get_server_certificate(); no ssl-module usage at all in this
      codebase. Negligible severity (CVSS 0.0).
      Next review date: 2027-02-25
