worker_processes {{ OPENRESTY_WORKER_PROCESSES }};

# /usr/local/openresty/nginx/logs/
error_log logs/error.log notice;

events {
    worker_connections 1024;
    multi_accept off;
}

http {
    include mime.types;

    lua_package_path "{{ FORC_BACKEND_PATH }}/scripts/?.lua;;";

    default_type application/octet-stream;

    resolver {{ OPENRESTY_DNS_SERVER }} valid=300s ipv6=off;

    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 100M;

    # LUA shared dicts
    lua_shared_dict discovery 1m;
    lua_shared_dict jwks 1m;
    lua_shared_dict sessions 10m;

    lua_code_cache on;


    # Websocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }


    # SSL defaults
    ssl_protocols TLSv1.2 TLSv1.3;




    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;


    # OIDC config
    init_by_lua_block {

        opts_session = {
            cookie_name = "sess_auth",
            secret = "{{ FORC_SECRET_KEY }}"
        }


        opts2 = {
            redirect_uri = "https://{{ DOMAIN }}/redirect_uri",
            discovery = "{{ FORC_OIDC_DISCOVERY_URL }}",
            client_id = "{{ FORC_OIDC_CLIENT_ID }}",
            client_secret = "{{ FORC_OIDC_CLIENT_SECRET }}",

            logout_path = "/logout",

            ssl_verify = "no",

            iat_slack = 600,

            scope = "openid email profile offline_access",

            renew_access_token_on_expiry = true,
            access_token_expires_leeway = 60,

            session_contents = {
                id_token = true,
                access_token = true
            }
        }
    }


    # Blocked IPs
    geo $blocked_ip {
        default 0;
        include /tmp/block_ips_geo.conf;
    }


    #
    # Internal HTTPS service
    #
{% if FORC_SERVICE_USE_HTTPS %}

    server {
        listen {{ FORC_SERVICE_PORT }} ssl;
        http2 on;

        server_name {{ DOMAIN }};


        ssl_certificate
            /etc/letsencrypt/live/{{ DOMAIN }}/fullchain.pem;

        ssl_certificate_key
            /etc/letsencrypt/live/{{ DOMAIN }}/privkey.pem;

        ssl_trusted_certificate
            /etc/letsencrypt/live/{{ DOMAIN }}/chain.pem;


        add_header Strict-Transport-Security
            "max-age=31536000; includeSubDomains; preload";

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin";


        ssl_stapling on;
        ssl_stapling_verify on;


        if ($blocked_ip) {
            return 444;
        }


        location / {

            proxy_pass http://unix:/tmp/forc.sock;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                https;


            proxy_http_version 1.1;

            proxy_set_header
                Upgrade
                $http_upgrade;

            proxy_set_header
                Connection
                $connection_upgrade;
        }
    }

{% else %}

    server {

        listen {{ FORC_LOCAL_IP }}:{{ FORC_SERVICE_PORT }};


        if ($blocked_ip) {
            return 444;
        }


        location / {

            proxy_pass http://unix:/tmp/forc.sock;


            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header
                X-Forwarded-For
                $proxy_add_x_forwarded_for;

            proxy_set_header
                X-Forwarded-Proto
                http;
        }
    }

{% endif %}



    #
    # HTTP redirect
    #
    server {

        listen 0.0.0.0:80 default_server;

        server_name {{ DOMAIN }};


        if ($blocked_ip) {
            return 444;
        }


        return 301 https://$host$request_uri;
    }



    #
    # nginx status
    #
    server {

        listen 127.0.0.1:8080;


        location /nginx_status {

            stub_status;

            allow 127.0.0.1;

            deny all;
        }
    }



    #
    # Public HTTPS + OIDC
    #
    server {

        listen 0.0.0.0:443 ssl;

        http2 on;


        server_name {{ DOMAIN }};


        ssl_certificate
            /etc/letsencrypt/live/{{ DOMAIN }}/fullchain.pem;

        ssl_certificate_key
            /etc/letsencrypt/live/{{ DOMAIN }}/privkey.pem;

        ssl_trusted_certificate
            /etc/letsencrypt/live/{{ DOMAIN }}/chain.pem;



        add_header Strict-Transport-Security
            "max-age=31536000; includeSubDomains; preload";

        add_header X-Frame-Options "SAMEORIGIN";

        add_header X-Content-Type-Options nosniff;

        add_header Referrer-Policy "strict-origin";



        ssl_stapling on;
        ssl_stapling_verify on;



        if ($blocked_ip) {
            return 444;
        }



        location / {


            access_by_lua_block {

                local res, err =
                    require("resty.openidc")
                    .authenticate(
                        opts2,
                        nil,
                        nil,
                        opts_session
                    )


                if err then

                    ngx.status = 500;

                    ngx.say(err);

                    ngx.exit(
                        ngx.HTTP_INTERNAL_SERVER_ERROR
                    );

                end



                ngx.req.set_header(
                    "X-Auth-Audience",
                    res.id_token.aud
                )

                ngx.req.set_header(
                    "X-Auth-Email",
                    res.id_token.email
                )

                ngx.req.set_header(
                    "X-Auth-ExpiresIn",
                    res.id_token.exp
                )

                ngx.req.set_header(
                    "X-Auth-Name",
                    res.id_token.name
                )

                ngx.req.set_header(
                    "X-Auth-Subject",
                    res.id_token.sub
                )

                ngx.req.set_header(
                    "X-Auth-Userid",
                    res.id_token.preferred_username
                )

                ngx.req.set_header(
                    "X-Auth-Username",
                    res.id_token.preferred_username
                )

                ngx.req.set_header(
                    "X-Auth-Locale",
                    res.id_token.locale
                )
            }
        }



        include {{ FORC_BACKEND_PATH }}/*.conf;



        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root html;
        }


        error_page 404 /404.html;

        location = /404.html {
            root html;
        }


        error_page 403 /403.html;

        location = /403.html {
            root html;
        }
    }
}