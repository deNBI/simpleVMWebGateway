name: Gixy-Next Scan

on:
  pull_request:

jobs:
  gixy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Gixy Scan Script
        run: |
          chmod +x test_gixy.sh
          ./test_gixy.sh
