name: Create Release Image
on:
  push:
    tags:
      - '*'
jobs:
  build_release:
    runs-on: ubuntu-latest

    steps:
     - name: Clean up repository directory (with elevated privileges) -.pytest_cache
       shell: bash
       run: |
            sudo rm -rfv ${{ github.workspace }}/.pytest_cache
     - name: Clean up repository directory (with elevated privileges) -.pytest_cache
       shell: bash
       run: |
                sudo rm -rfv ${{ github.workspace }}/*
     - name: Get the version
       id: get_version
       run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}
     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
     - name: Login to oci.bi.denbi.de
       uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
       with:
          registry: oci.bi.denbi.de
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_TOKEN }}
     - name: Build and publish image to OCI
       uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
       with:
          file: docker/Dockerfile
          push: true
          tags: oci.bi.denbi.de/simplevm/forc:${{ steps.get_version.outputs.VERSION }}
          load: true
     - name: Install unzip
       run: sudo apt-get update && sudo apt-get install -y unzip
     - name: Generate SBOM
       uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
       with:
          image: oci.bi.denbi.de/simplevm/forc:${{ steps.get_version.outputs.VERSION }}
          format: spdx-json
          output-file: ${{ github.event.repository.name }}-sbom-${{ steps.get_version.outputs.VERSION }}.spdx.json
