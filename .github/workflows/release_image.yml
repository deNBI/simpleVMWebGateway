name: Create Release Image
on:
  push:
    tags:
      - '*'
jobs:
  release:
    uses: denbi/portal-github-actions/.github/workflows/release-image.yml@b1a0d8432e7498518ab03848cbbb976f5b64b186 # main
    with:
      image_name: oci.bi.denbi.de/simplevm/forc
      dockerfile: docker/Dockerfile
      notify_matrix: true
      image_tag: ${{ github.ref_name }}
      RUNS_ON: '["ubuntu-latest"]'

    secrets:
      OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_TOKEN }}
      CUSTOM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
      MATRIX_ROOM: ${{ secrets.MATRIX_CRITICAL_ROOM }}
