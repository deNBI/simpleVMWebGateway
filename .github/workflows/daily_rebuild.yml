name: Daily Rebuild and Scan
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  rebuild_and_scan:
    uses: denbi/portal-github-actions/.github/workflows/release-image.yml@02ae1f46b32e057557da1e90ec0e4c28b7c3754d # main
    with:
      image_name: oci.bi.denbi.de/simplevm/forc
      dockerfile: docker/Dockerfile
      notify_matrix: true
      RUNS_ON: '["ubuntu-latest"]'

    secrets:
      OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_TOKEN }}
      CUSTOM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
      MATRIX_ROOM: ${{ secrets.MATRIX_CRITICAL_ROOM }}
