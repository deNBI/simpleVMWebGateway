name: Publish Docker
on:
  workflow_dispatch:
  push:
    branches:
      - 'staging'
      - 'dev'
      - 'hotfix/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clean up repository directory (with elevated privileges) -.pytest_cache
        shell: bash
        run: |
                sudo rm -rfv ${{ github.workspace }}/.pytest_cache
      - name: Clean up repository directory (with elevated privileges) -.pytest_cache
        shell: bash
        run: |
                sudo rm -rfv ${{ github.workspace }}/*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract branch name
        shell: bash
        run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
        id: extract_branch

      - name: Set tag
        run: sed 's/\//-/g'  <<< "::set-output name=TAG::${{ steps.extract_branch.outputs.branch }}"
        id: tag
      - name: Get tag
        run: echo "The selected tag is ${{ steps.tag.outputs.TAG }}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to oci.bi.denbi.de
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: oci.bi.denbi.de
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_TOKEN }}
      - name: Build and publish image to OCI
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          file: docker/Dockerfile
          push: true
          tags: oci.bi.denbi.de/simplevm/forc:${{ steps.tag.outputs.TAG }}
