name: Publish Docker
on:
  workflow_dispatch:
  push:
    branches:
      - 'staging'
      - 'dev'
      - 'hotfix/**'

jobs:
  publish:
    uses: denbi/portal-github-actions/.github/workflows/publish-branch-image.yml@944ddd131cde0fcc9e340918516571d27e08be55 # main
    with:
      image_name: oci.bi.denbi.de/simplevm/forc
      dockerfile: docker/Dockerfile
      RUNS_ON: '["ubuntu-latest"]'

    secrets:
      OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_TOKEN }}
      CUSTOM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
