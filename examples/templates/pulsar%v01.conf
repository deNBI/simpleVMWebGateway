# PULSAR BOYC resenv - FORC backend template
#
# Reverse-proxies the PULSAR BOYC information service (a FastAPI app served at
# `/`) to the user under /{{ key_url }}/. Access control (openidc + owner-only
# authorization) is enforced in the lua block below; the app itself performs no
# authentication.
#
# The app has no URL prefix of its own, so the /{{ key_url }}/ prefix must be
# stripped before proxying (see the rewrite below).

location /{{ key_url }}/ {

        set $user_path '{{ forc_backend_path }}/users/{{backend_id}}/';
        # Run this lua block, which checks if we are authenticated (again) and filters request by JWT (via id_token.sub)
        access_by_lua_block {
                local user_service = require("user_service")

                {% if not auth_enabled %}
                local consent_service = require("consent_service")
                consent_service.check_consent("{{ key_url }}")
                {% endif %}

                -- Start actual openid authentication procedure
                local res, err = require("resty.openidc").authenticate(opts2)
                -- If it fails for some reason, escape via HTTP 500
                if err then
                        ngx.status = 500
                        ngx.say(err)
                        ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
                end

                {% if auth_enabled %}
                -- Protect this location and allow only the owner (or a user present in the backend path)
                        if (res.id_token.sub ~= "{{ owner }}" and not user_service.file_exists(ngx.var.user_path .. res.id_token.sub)) then
                                ngx.exit(ngx.HTTP_FORBIDDEN)
                        end
                {% else %}
                        -- AUTH DISABLED, ALLOW ANY USER WITH A VALID TOKEN
                {% endif %}
        }

        # The app is served at "/", so strip the /{{ key_url }} prefix before
        # proxying: /{{ key_url }}/docs -> /docs
        rewrite ^/{{ key_url }}/(.*)$ /$1 break;

        # Proxy to the PULSAR resenv backend.
        proxy_pass "{{ location_url }}";

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 0;
        access_log logs/pulsar.access.log;
        error_log logs/pulsar.error.log;
}
